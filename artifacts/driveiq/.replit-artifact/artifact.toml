kind = "web"
previewPath = "/"
title = "DriveIQ - Driving School Marketplace"
version = "1.0.0"
id = "artifacts/driveiq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19465

[services.development]
run = "pnpm --filter @workspace/driveiq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driveiq", "run", "build" ]
publicDir = "artifacts/driveiq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19465"
BASE_PATH = "/"
