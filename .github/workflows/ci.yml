name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: driveiq_test
          POSTGRES_USER: driveiq
          POSTGRES_PASSWORD: driveiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driveiq -d driveiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, mbstring, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          cat >> .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=driveiq_test
          DB_USERNAME=driveiq
          DB_PASSWORD=driveiq
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          BROADCAST_CONNECTION=log
          REDIS_HOST=127.0.0.1
          EOF

      - name: Run migrations
        run: php artisan migrate --force

      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            frontend/node_modules
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile.prod -t driveq-app:ci backend

      - name: Build web image
        run: docker build -f frontend/Dockerfile.prod -t driveq-web:ci frontend

      - name: Validate Caddyfile
        run: docker run --rm driveq-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: API image boots and answers through Caddy
        run: |
          docker network create dq
          docker run -d --name app --network dq \
            -e APP_KEY=base64:$(openssl rand -base64 32) -e APP_ENV=production \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync -e LOG_CHANNEL=stderr \
            driveq-app:ci
          docker run -d --name web --network dq -p 8080:80 driveq-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/up >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/up
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404
