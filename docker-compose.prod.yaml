# DriveQ production stack for one VM (DIQ-1301).
#
#   cp deploy/.env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yaml --env-file .env.production up -d --build
#
# Only Caddy (web) publishes ports: 80 and 443. Everything else talks on the
# private compose network. Secrets live in .env.production, never in git.

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  image: driveq-app:latest
  restart: unless-stopped
  env_file: .env.production
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    LOG_CHANNEL: stderr
  volumes:
    - app_storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-driveq}
      POSTGRES_USER: ${DB_USERNAME:-driveq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # PHP-FPM API. Runs migrations on start.
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"

  # Queued mail, WhatsApp and notification jobs.
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started

  # routes/console.php: reminders, retention, plan lifecycle, outreach.
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started

  # Caddy: HTTPS, the built React app, and /api → app:9000.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: driveq-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
