services:
  postgres:
    image: postgres:16
    container_name: driveiq-postgres
    environment:
      POSTGRES_DB: driveiq
      POSTGRES_USER: driveiq
      POSTGRES_PASSWORD: driveiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveiq -d driveiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driveiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: driveiq
      DB_USERNAME: driveiq
      DB_PASSWORD: driveiq
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    command: >
      sh -lc "composer install --no-interaction --prefer-dist
      && php artisan key:generate --force
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driveiq-frontend
    depends_on:
      - backend
    environment:
      PORT: 5173
      BASE_PATH: /
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: >
      sh -lc "corepack enable
      && pnpm install --frozen-lockfile
      && pnpm --filter @workspace/driveiq dev"

volumes:
  postgres_data:
