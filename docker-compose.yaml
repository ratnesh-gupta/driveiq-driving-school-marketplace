services:
  postgres:
    image: postgres:16
    container_name: driveiq-postgres
    environment:
      POSTGRES_DB: driveiq
      POSTGRES_USER: driveiq
      POSTGRES_PASSWORD: driveiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U driveiq -d driveiq" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driveiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    command: >
      sh -lc "composer install --no-interaction --prefer-dist && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driveiq-frontend
    depends_on:
      - backend
    environment:
      PORT: 5173
      BASE_PATH: /
      VITE_API_BASE_URL: http://localhost:8000/api
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: >
      sh -lc "corepack enable && pnpm approve-builds esbuild 2>/dev/null || true && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
