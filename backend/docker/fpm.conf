; PHP-FPM pool for the DriveQ API (DIQ-1301). Sized for a 2–4 GB VM:
; each worker uses roughly 40–60 MB.
[www]
listen = 9000
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
